<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>TV Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="dashboard" class="screen">
    <header class="top">
      <div id="date" class="date"></div>
      <div id="clock" class="clock"></div>
    </header>

    <main class="tiles">
      <section class="tile tile-in">
        <div class="tile-label">Innen <span id="in-name" class="sub"></span></div>
        <div class="value"><span id="in-temp">–</span><span class="unit">°C</span></div>
        <div id="in-detail" class="detail"></div>
      </section>
      <section class="tile tile-out">
        <div class="tile-label">Außen</div>
        <div class="value"><span id="out-temp">–</span><span class="unit">°C</span></div>
        <div id="out-detail" class="detail"></div>
      </section>
    </main>

    <nav class="actions">
      <button class="btn btn-primary focusable" id="btn-youtube" data-action="youtube">
        <span class="btn-icon">▶</span> YouTube
      </button>
      <button class="btn focusable" id="btn-setup" data-action="setup">
        <span class="btn-icon">⚙</span> Einstellungen
      </button>
    </nav>

    <footer class="status">
      <span id="conn-dot" class="dot"></span><span id="conn-text">Verbinde …</span>
    </footer>
  </div>

  <div id="setup" class="screen hidden">
    <h1>Einstellungen</h1>
    <p class="hint">Tipp: Für das lange Token die Tastatur der SmartThings-App am Handy nutzen (Einfügen möglich).</p>
    <label>Home-Assistant-Adresse
      <input class="focusable" id="cfg-url" type="text" spellcheck="false">
    </label>
    <label>Long-Lived Access Token
      <input class="focusable" id="cfg-token" type="text" spellcheck="false">
    </label>
    <label>Entity innen (climate.* oder sensor.*)
      <input class="focusable" id="cfg-in" type="text" spellcheck="false">
    </label>
    <label>Entity außen
      <input class="focusable" id="cfg-out" type="text" spellcheck="false">
    </label>
    <div class="setup-actions">
      <button class="btn btn-primary focusable" data-action="save">Speichern</button>
      <button class="btn focusable" data-action="cancel">Abbrechen</button>
    </div>
    <p id="setup-msg" class="hint"></p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
